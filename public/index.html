
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Collection</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <div>
            <p class="eyebrow">YOUR PERSONAL LIBRARY</p>
            <h1>Movie Collection</h1>
            <p class="subtitle">Keep track of the movies you love.</p>
        </div>
        <span class="header-icon">▶</span>
    </header>

    <main class="container">
        <section class="stats">
            <div class="stat-card">
                <span>Total movies</span>
                <strong id="totalCount">0</strong>
            </div>
            <div class="stat-card">
                <span>Watched</span>
                <strong id="watchedCount">0</strong>
            </div>
            <div class="stat-card">
                <span>Unwatched</span>
                <strong id="unwatchedCount">0</strong>
            </div>
        </section>

        <section class="panel">
            <h2 id="formHeading">Add a Movie</h2>

            <form id="movieForm">
                <input type="hidden" id="movieId">

                <div class="form-grid">
                    <label>
                        Movie title *
                        <input id="title" maxlength="100"
                               placeholder="e.g. Inception" required>
                    </label>

                    <label>
                        Genre *
                        <input id="genre" maxlength="50"
                               placeholder="e.g. Sci-Fi" required>
                    </label>

                    <label>
                        Release year *
                        <input id="releaseYear" type="number"
                               min="1888" max="2100" required>
                    </label>

                    <label>
                        Rating (0–10)
                        <input id="rating" type="number"
                               min="0" max="10" step="0.1"
                               placeholder="e.g. 8.5">
                    </label>

                    <label>
                        Watched?
                        <select id="watched">
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" id="saveButton">Add Movie</button>
                    <button type="button" id="cancelButton"
                            class="secondary hidden">Cancel Edit</button>
                </div>
            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>

        <section class="panel">
            <div class="list-heading">
                <div>
                    <h2>Your Movies</h2>
                    <p class="subtitle">Your saved movie collection</p>
                </div>

                <input id="search" class="search"
                       placeholder="Search title or genre...">
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Genre</th>
                            <th>Year</th>
                            <th>Rating</th>
                            <th>Watched</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="movieTable">
                        <tr>
                            <td colspan="7">Loading movies...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer>Movie Collection · Powered by MySQL</footer>
</body>
</html>
